# No App Groups or other paid-only capabilities: the app installs with a FREE Apple ID
# (sideloaded) as well as through TestFlight later.
# Xcode project, generated (no Mac needed to edit): `xcodegen generate` on the macOS build
# machine (GitHub Actions) creates Hail.xcodeproj from this file.
name: Hail
options:
  bundleIdPrefix: app.hail
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${HAIL_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
packages:
  HailCore:
    path: HailCore
targets:
  Hail:
    type: application
    platform: iOS
    sources:
      - Hail
      - path: ../backend/app/readers_config.json
        buildPhase: resources
    dependencies:
      - package: HailCore
      - target: HailBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hail.ios
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Hail/Info.plist
      properties:
        CFBundleDisplayName: Hail
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [uber, olacabs]
        CFBundleURLTypes:
          - CFBundleURLName: app.hail.ios
            CFBundleURLSchemes: [hail]
        NSMicrophoneUsageDescription: "Only when you tap the mic: say where you want to go."
        NSSpeechRecognitionUsageDescription: "Your iPhone turns your voice into text (on the iPhone where supported). Hail never receives audio."
        NSLocationWhenInUseUsageDescription: "Read once when you ask for a ride, so pickup can be where you are. Never tracked in the background."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HailBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - HailBroadcast
      - path: ../backend/app/readers_config.json
        buildPhase: resources
    dependencies:
      - package: HailCore
      - sdk: ReplayKit.framework
      - sdk: Vision.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hail.ios.broadcast
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HailBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Hail screen reading
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
schemes:
  Hail:
    build:
      targets:
        Hail: all
